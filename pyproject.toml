[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontask"
version = "1.0.0"
description = "Periodic on-task check-ins with focus tracking and escalating reminder intervals."
requires-python = ">=3.11"
dependencies = [
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-UserNotifications>=10.0; sys_platform == 'darwin'",
    "pynput>=1.7.6",
]

[project.scripts]
ontask = "ontask.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ontask*"]

[project.optional-dependencies]
# Tooling for tests, lint and the security checks CI runs:
#     pip install -e ".[dev]"
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
]
# Building OnTask.app; see scripts/build-mac-app.sh.
bundle = [
    "py2app>=0.28; sys_platform == 'darwin'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, and pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ontask"]

[tool.bandit]
exclude_dirs = ["tests"]
# try/except/pass and try/except/continue are how each OS integration degrades
# instead of crashing when a permission or framework is missing.
skips = ["B110", "B112"]
