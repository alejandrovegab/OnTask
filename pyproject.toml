[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontask"
version = "1.0.0"
description = "Periodic on-task check-ins with focus tracking and escalating reminder intervals."
requires-python = ">=3.10"
dependencies = [
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-UserNotifications>=10.0; sys_platform == 'darwin'",
    "pynput>=1.7.6",
]

[project.scripts]
ontask = "ontask.__main__:main"

[tool.setuptools.packages.find]
include = ["ontask*"]

[project.optional-dependencies]
# Tooling for tests, lint and the security checks CI runs:
#     pip install -e ".[dev]"
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, and pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ontask"]
